models:
  default: granite4.1:3b
  tiers:
    small:
      name: granite4.1:3b
      estimatedRamMb: 1024
    medium:
      name: llama3.1:8b
      estimatedRamMb: 8192
    large:
      name: qwen2.5-coder:14b
      estimatedRamMb: 16000

memory:
  maxRamMb: 4096
  reserveSystemRamMb: 512
  waitForCapacity: false
  capacityCheckIntervalMs: 1000

runtime:
  maxDynamicDepth: 4
  maxBranches: 3
  maxPromptCharacters: 6000
  maxModelCalls: 24
  maxToolRounds: 3

agents:
  default:
    tools: [shell, write_file, web_search, web_fetch]
    models:
      depth: small
      classify: small
      decompose: small
      answer: small
      summarize: small
      synthesize: small
      plan: medium
  coding:
    tools: [shell, write_file, web_search, web_fetch]
    models:
      depth: small
      classify: small
      decompose: small
      answer: small
      summarize: small
      synthesize: small
      plan: medium
  qa:
    tools: [shell, write_file]
    models:
      depth: small
      classify: small
      decompose: small
      answer: small
      summarize: small
      synthesize: small
      plan: medium
  product_designer:
    tools: [web_search, web_fetch, write_file]
    models:
      depth: small
      classify: small
      decompose: small
      answer: small
      summarize: small
      synthesize: small
      plan: medium
  research:
    tools: [web_search, web_fetch]
    models:
      depth: small
      classify: small
      decompose: small
      answer: small
      summarize: small
      synthesize: small
      plan: medium

workflows:
  default:
    mode: ram_queue
    agents: [research, product_designer, coding]
    continueOnError: false
    dispatch:
      strategy: complexity_tiers
      tiers:
        - name: simple
          maxEstimatedDepth: 1
          agents: [coding]
          qa: false
        - name: normal
          maxEstimatedDepth: 2
          agents: [coding]
          qa: true
        - name: complex
          agents: [research, product_designer, coding]
          qa: true
    qa:
      agent: qa
      validationCommands:
        - npm test
        - npm run build
      bugfixQueue:
        id: bugfix
        priority: 100
        highestPriorityKeywords: [fail, error, regression, broken, crash]
