models:
  default: granite4.1:3b
  tiers:
    small:
      name: granite4.1:3b
      estimatedRamMb: 4096
    medium:
      name: llama3.1:8b
      estimatedRamMb: 8192
    large:
      name: qwen2.5-coder:14b
      estimatedRamMb: 16000

memory:
  maxRamMb: auto
  reserveSystemRamMb: 2048
  waitForCapacity: true
  capacityCheckIntervalMs: 1000

agents:
  default:
    tools: [shell, write_file, google_search, web_fetch]
    models:
      depth: small
      classify: small
      decompose: medium
      answer: dynamic
      summarize: small
      synthesize: medium
  coding:
    tools: [shell, write_file, google_search, web_fetch]
    models:
      depth: small
      classify: small
      decompose: medium
      answer: dynamic
      summarize: small
      synthesize: medium
  qa:
    tools: [shell, write_file]
    models:
      depth: small
      classify: small
      decompose: medium
      answer: dynamic
      summarize: small
      synthesize: medium
  product_designer:
    tools: [google_search, web_fetch, write_file]
    models:
      depth: small
      classify: small
      decompose: medium
      answer: dynamic
      summarize: small
      synthesize: medium
  research:
    tools: [google_search, web_fetch]
    models:
      depth: small
      classify: small
      decompose: medium
      answer: dynamic
      summarize: small
      synthesize: medium

workflows:
  default:
    mode: ram_queue
    agents: [research, product_designer, coding]
    continueOnError: false
    qa:
      agent: qa
      validationCommands:
        - npm test
        - npm run build
      bugfixQueue:
        id: bugfix
        priority: 100
        highestPriorityKeywords: [fail, error, regression, broken, crash]
